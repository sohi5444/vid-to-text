<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohail FX - Video to Text AI</title>
    <script src="transformers.min.js"></script>
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            background: #0d1117; color: #c9d1d9;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            min-height: 100vh; display: flex; flex-direction: column;
        }
        nav {
            background: #000; padding: 15px 20px; border-bottom: 1px solid #222;
            display: flex; justify-content: space-between; align-items: center;
        }
        nav .logo { font-weight:700; font-size:1.2rem; color:#fff; }
        nav .menu a { color: #aaa; text-decoration: none; margin-left: 20px; font-size: 0.9rem; }
        .container { max-width: 600px; width: 100%; margin: 30px auto; padding: 0 15px; flex: 1; }
        .card {
            background: #161b22; border: 1px solid #30363d;
            border-radius: 16px; padding: 30px 20px;
        }
        h1 { text-align:center; font-size:1.6rem; margin-bottom:5px; color:#fff; }
        .subtitle { text-align:center; color:#8b949e; margin-bottom:25px; font-size:0.85rem; }

        .file-btn-wrapper {
            position: relative; display: block; margin: 0 auto 15px; max-width: 250px;
        }
        .file-btn-wrapper input[type="file"] {
            position: absolute; left: 0; top: 0; width: 100%; height: 100%;
            opacity: 0; cursor: pointer; font-size: 0;
        }
        .file-btn-wrapper .fake-btn {
            display: block; background: #58a6ff; color: #000; font-weight: 700;
            padding: 14px 30px; border-radius: 30px; text-align: center; pointer-events: none;
        }
        #fileDisplay {
            font-size: 0.85rem; color: #3fb950; word-break: break-all; text-align: center;
            min-height: 1.5em; margin-bottom: 15px;
        }
        select, .btn { width: 100%; padding: 12px; border-radius: 30px; font-size: 0.95rem; margin: 8px 0; }
        select { background: #1a1a1a; border: 1px solid #30363d; color: #fff; }
        .btn { background: #3fb950; border: none; color: #000; font-weight: 700; cursor: pointer; }
        .btn:disabled { background: #444; color:#888; cursor:not-allowed; }

        .status-box {
            background: #0a0a0a; border: 1px solid #333; border-radius: 8px;
            padding: 12px; font-family: monospace; font-size: 0.8rem; color: #0f0;
            margin: 15px 0; min-height: 2.5em; line-height: 1.5;
        }
        
        /* PROGRESS BAR - ALWAYS VISIBLE DURING LOADING */
        #progressContainer {
            display: none;
            margin: 15px 0;
            background: #1a1a1a;
            padding: 15px;
            border-radius: 10px;
        }
        #progressLabel {
            font-size: 0.8rem;
            color: #aaa;
            margin-bottom: 8px;
            text-align: center;
        }
        .progress-bar {
            height: 10px;
            background: #333;
            border-radius: 5px;
            overflow: hidden;
        }
        .progress-fill {
            width: 0%;
            height: 100%;
            background: linear-gradient(90deg, #58a6ff, #3fb950);
            border-radius: 5px;
            transition: width 0.3s ease;
            box-shadow: 0 0 10px rgba(88,166,255,0.5);
        }
        #progressPercent {
            text-align: center;
            font-weight: 700;
            font-size: 1rem;
            color: #fff;
            margin-top: 5px;
        }

        .result-box { display: none; background: #1a1a1a; border: 1px solid #3fb950; border-radius: 12px; margin-top: 15px; }
        .result-text { padding: 15px; max-height: 300px; overflow-y: auto; font-family: monospace; font-size: 0.85rem; white-space: pre-wrap; }
        .result-actions { display: flex; gap: 8px; padding: 12px; background: #111; border-top: 1px solid #333; }
        .icon-btn { flex:1; background: transparent; border:1px solid #444; color:#ccc; padding:8px; border-radius:6px; cursor:pointer; text-align:center; font-size:0.8rem; }
        footer { text-align:center; padding:15px; color:#666; border-top:1px solid #222; margin-top:30px; font-size:0.8rem; }
    </style>
</head>
<body>
<nav>
    <div class="logo">SOHAIL FX</div>
    <div class="menu">
        <a href="#">Home</a>
        <a href="#">About</a>
        <a href="#">Contact</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h1>Video to Text AI</h1>
        <p class="subtitle">100% Private - Browser-Based - No Upload</p>

        <div class="file-btn-wrapper">
            <input type="file" id="fileInput" accept="video/*,audio/*">
            <div class="fake-btn">Choose Video</div>
        </div>
        <div id="fileDisplay"></div>

        <select id="langSelect">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="ur">Urdu</option>
            <option value="auto">Auto-detect</option>
        </select>

        <button class="btn" id="transcribeBtn">Start Transcription</button>

        <div class="status-box" id="statusBox">Loading AI engine...</div>

        <!-- PROGRESS CONTAINER -->
        <div id="progressContainer">
            <div id="progressLabel">Downloading AI Model</div>
            <div class="progress-bar">
                <div class="progress-fill" id="progressFill"></div>
            </div>
            <div id="progressPercent">0%</div>
        </div>

        <div class="result-box" id="resultBox">
            <div class="result-text" id="transcriptText"></div>
            <div class="result-actions">
                <button class="icon-btn" id="copyBtn">Copy</button>
                <button class="icon-btn" id="downloadBtn">Download</button>
            </div>
        </div>
    </div>
</div>

<footer>Made by Sohail FX</footer>

<script>
    function waitForPipeline() {
        return new Promise((resolve) => {
            if (window.pipeline) { resolve(); return; }
            const check = setInterval(() => {
                if (window.pipeline) { clearInterval(check); resolve(); }
            }, 100);
        });
    }
</script>

<script type="module">
    const statusBox = document.getElementById('statusBox');
    const fileInput = document.getElementById('fileInput');
    const fileDisplay = document.getElementById('fileDisplay');
    const transcribeBtn = document.getElementById('transcribeBtn');
    const progressContainer = document.getElementById('progressContainer');
    const progressFill = document.getElementById('progressFill');
    const progressPercent = document.getElementById('progressPercent');
    const progressLabel = document.getElementById('progressLabel');
    const resultBox = document.getElementById('resultBox');
    const transcriptText = document.getElementById('transcriptText');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const langSelect = document.getElementById('langSelect');

    let selectedFile = null;
    let transcriber = null;
    let modelReady = false;

    function log(msg) {
        console.log(msg);
        statusBox.textContent = msg;
    }

    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            selectedFile = fileInput.files[0];
            const sizeMB = (selectedFile.size / (1024*1024)).toFixed(1);
            fileDisplay.textContent = selectedFile.name + ' (' + sizeMB + ' MB)';
            log('File selected: ' + selectedFile.name);
        }
    });

    async function loadModel() {
        progressContainer.style.display = 'block';
        progressLabel.textContent = 'Downloading AI Model (one-time, ~40 MB)';
        progressFill.style.width = '0%';
        progressPercent.textContent = '0%';
        log('Downloading AI model...');

        try {
            transcriber = await window.pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
                progress_callback: (p) => {
                    if (p && p.status === 'progress' && p.total) {
                        const pct = Math.round((p.loaded / p.total) * 100);
                        progressFill.style.width = pct + '%';
                        progressPercent.textContent = pct + '%';
                        log('Downloading model: ' + pct + '%');
                    }
                    if (p && p.status === 'done') {
                        progressFill.style.width = '100%';
                        progressPercent.textContent = '100%';
                    }
                }
            });

            modelReady = true;
            progressContainer.style.display = 'none';
            log('AI ready! Select a video and click Start Transcription.');
        } catch (err) {
            console.error(err);
            progressContainer.style.display = 'none';
            log('Error: ' + err.message + '. Refresh to retry.');
        }
    }

    async function init() {
        log('Loading library...');
        await waitForPipeline();
        log('Library ready. Starting model download...');
        await loadModel();
    }

    init();

    async function extractAudio(file) {
        return new Promise((resolve, reject) => {
            const video = document.createElement('video');
            video.preload = 'metadata';
            video.muted = true;
            video.playsInline = true;
            const url = URL.createObjectURL(file);
            video.src = url;

            video.onloadedmetadata = async () => {
                const duration = video.duration;
                if (!isFinite(duration) || duration === 0) {
                    URL.revokeObjectURL(url);
                    reject(new Error('Cannot read video.'));
                    return;
                }
                const sampleRate = 16000;
                const offlineCtx = new OfflineAudioContext(1, sampleRate * duration, sampleRate);
                const source = offlineCtx.createMediaElementSource(video);
                source.connect(offlineCtx.destination);
                try {
                    video.play();
                    const renderedBuffer = await offlineCtx.startRendering();
                    video.pause();
                    URL.revokeObjectURL(url);
                    resolve({ pcm: renderedBuffer.getChannelData(0), duration });
                } catch (e) {
                    URL.revokeObjectURL(url);
                    reject(e);
                }
            };
            video.onerror = () => {
                URL.revokeObjectURL(url);
                reject(new Error('Failed to load video.'));
            };
        });
    }

    transcribeBtn.addEventListener('click', async () => {
        if (!selectedFile) {
            log('Please select a video file first.');
            return;
        }
        if (!modelReady) {
            log('AI still loading. Please wait...');
            return;
        }

        transcribeBtn.disabled = true;
        resultBox.style.display = 'none';
        progressContainer.style.display = 'block';
        progressLabel.textContent = 'Processing';
        progressFill.style.width = '0%';
        progressPercent.textContent = '0%';
        const start = Date.now();

        try {
            log('Extracting audio...');
            progressFill.style.width = '30%';
            progressPercent.textContent = '30%';

            const { pcm, duration } = await extractAudio(selectedFile);
            log('Transcribing ' + duration.toFixed(0) + 's of audio...');
            progressFill.style.width = '60%';
            progressPercent.textContent = '60%';

            const lang = langSelect.value === 'auto' ? undefined : langSelect.value;
            const result = await transcriber(pcm, {
                chunk_length_s: 30,
                stride_length_s: 5,
                language: lang
            });

            const elapsed = ((Date.now() - start) / 1000).toFixed(0);
            progressFill.style.width = '100%';
            progressPercent.textContent = '100%';
            log('Done in ' + elapsed + ' seconds!');

            transcriptText.textContent = result.text;
            resultBox.style.display = 'block';
            progressContainer.style.display = 'none';
        } catch (err) {
            console.error(err);
            log('Error: ' + err.message);
            progressContainer.style.display = 'none';
        } finally {
            transcribeBtn.disabled = false;
        }
    });

    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(transcriptText.textContent);
        log('Copied!');
    });
    downloadBtn.addEventListener('click', () => {
        const blob = new Blob([transcriptText.textContent], { type: 'text/plain' });
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'transcript.txt';
        a.click();
        log('Downloaded!');
    });
</script>
</body>
</html>
