<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohàil FX - Free Video to Text AI</title>
    <meta name="description" content="Convert video to text free. AI transcription in your browser. Fast, private, unlimited.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: #fff;
            color: #000;
            min-height: 100vh;
        }
        nav {
            background: #000;
            padding: 15px 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        nav .logo { color: #fff; font-size: 1.3rem; font-weight: 700; }
        nav .menu { display: flex; gap: 15px; }
        nav .menu a { color: #aaa; text-decoration: none; font-size: 0.85rem; }
        nav .menu a.active, nav .menu a:hover { color: #fff; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px 15px; }
        .card { background: #f8f8f8; border-radius: 16px; padding: 25px 20px; border: 1px solid #ddd; }
        h1 { font-size: 1.8rem; font-weight: 800; text-align: center; }
        .subtitle { text-align: center; color: #666; margin: 5px 0 20px; font-size: 0.9rem; }
        
        /* UPLOAD BOX - Always visible */
        .upload-box {
            display: block;
            width: 100%;
            padding: 35px 20px;
            background: #fff;
            border: 3px dashed #000;
            border-radius: 12px;
            cursor: pointer;
            text-align: center;
            margin: 15px 0;
        }
        .upload-box:active { background: #f0f0f0; }
        .upload-box .icon { font-size: 3rem; display: block; }
        .upload-box .text { font-weight: 600; margin-top: 8px; }
        .upload-box .hint { font-size: 0.75rem; color: #999; margin-top: 4px; }

        /* FILE INFO */
        .file-info {
            display: none;
            background: #e8f5e9;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.9rem;
            font-weight: 600;
        }

        /* STATUS */
        #statusBox {
            background: #f0f0f0;
            padding: 10px;
            border-radius: 8px;
            margin: 10px 0;
            font-size: 0.85rem;
            font-weight: 500;
            min-height: 20px;
        }

        /* BUTTONS */
        .btn {
            background: #000;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            width: 100%;
            margin: 8px 0;
        }
        .btn:disabled { background: #ccc; cursor: not-allowed; }
        
        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 30px;
            font-size: 0.9rem;
            margin: 8px 0;
            background: #fff;
        }

        /* PROGRESS */
        .progress-wrap { display: none; margin: 10px 0; }
        .progress-bar { height: 8px; background: #ddd; border-radius: 5px; overflow: hidden; }
        .progress-fill { height: 100%; background: #000; width: 0%; transition: width 0.3s; }
        .progress-text { font-size: 0.8rem; margin-top: 3px; text-align: right; font-weight: 600; }

        /* RESULT */
        .result-box {
            display: none;
            background: #fff;
            border: 2px solid #000;
            border-radius: 12px;
            padding: 15px;
            margin-top: 15px;
            max-height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
        }
        .result-actions { display: flex; gap: 8px; margin-top: 10px; }
        .small-btn {
            flex: 1;
            background: #fff;
            border: 2px solid #000;
            padding: 8px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }
        .small-btn:active { background: #000; color: #fff; }

        footer {
            text-align: center;
            padding: 15px;
            background: #000;
            color: #fff;
            font-size: 0.8rem;
            margin-top: 20px;
        }
    </style>
</head>
<body>

<nav>
    <div class="logo">SOHÀIL FX</div>
    <div class="menu">
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h1> Video  Text</h1>
        <p class="subtitle">Fast • Free • Private • Unlimited</p>

        <!-- UPLOAD - Always visible -->
        <label for="fileInput" class="upload-box" id="uploadBox">
            <span class="icon"></span>
            <span class="text">Tap to Select Video</span>
            <span class="hint">MP4, MOV, AVI, MKV supported</span>
        </label>
        <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none;">

        <!-- File info after selection -->
        <div class="file-info" id="fileInfo"></div>

        <!-- Language -->
        <select id="langSelect">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="ur">Urdu</option>
            <option value="auto">Auto-Detect</option>
        </select>

        <!-- Transcribe button -->
        <button class="btn" id="transcribeBtn"> Start Transcription</button>

        <!-- Status -->
        <div id="statusBox"> Ready — Select a video and tap above</div>

        <!-- Progress -->
        <div class="progress-wrap" id="progressWrap">
            <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
            <div class="progress-text" id="progressText">0%</div>
        </div>

        <!-- Result -->
        <div class="result-box" id="resultBox">
            <div id="transcriptText"></div>
            <div class="result-actions">
                <button class="small-btn" id="copyBtn"> Copy</button>
                <button class="small-btn" id="downloadBtn"> Download</button>
            </div>
        </div>
    </div>
</div>

<footer> Made by <strong>Sohàil FX</strong> </footer>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/dist/transformers.min.js';
    import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js';

    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const transcribeBtn = document.getElementById('transcribeBtn');
    const statusBox = document.getElementById('statusBox');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressText = document.getElementById('progressText');
    const resultBox = document.getElementById('resultBox');
    const transcriptText = document.getElementById('transcriptText');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const langSelect = document.getElementById('langSelect');

    let selectedFile = null;
    let transcriber = null;
    let ffmpeg = null;

    // ----- LOAD EVERYTHING IN BACKGROUND -----
    statusBox.textContent = ' Loading AI engine... (first time ~40MB, one-time)';

    // Load FFmpeg
    ffmpeg = new FFmpeg();
    ffmpeg.load().then(() => {
        statusBox.textContent = ' Loading AI model...';
    }).catch(e => {
        statusBox.textContent = ' Error loading. Check internet.';
    });

    // Load Whisper TINY model (fast, small 40MB)
    pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
        progress_callback: (info) => {
            if (info?.status === 'progress' && info.total) {
                const pct = Math.round((info.loaded / info.total) * 100);
                statusBox.textContent = ' Loading AI model... ' + pct + '%';
            }
        }
    }).then(model => {
        transcriber = model;
        statusBox.textContent = ' Ready! Select a video and tap transcribe.';
    }).catch(e => {
        statusBox.textContent = ' AI model failed. Refresh page.';
    });

    // ----- FILE SELECTION -----
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            selectedFile = fileInput.files[0];
            const sizeMB = (selectedFile.size / 1048576).toFixed(1);
            fileInfo.textContent = ' ' + selectedFile.name + ' (' + sizeMB + ' MB)';
            fileInfo.style.display = 'block';
        }
    });

    // ----- TRANSCRIBE -----
    transcribeBtn.addEventListener('click', async () => {
        if (!selectedFile) {
            statusBox.textContent = ' Please select a video file first.';
            return;
        }
        if (!transcriber || !ffmpeg) {
            statusBox.textContent = ' AI still loading, please wait...';
            return;
        }

        transcribeBtn.disabled = true;
        resultBox.style.display = 'none';
        progressWrap.style.display = 'block';
        progressFill.style.width = '0%';
        progressText.textContent = '0%';
        statusBox.textContent = ' Processing...';

        try {
            // Read file
            const buffer = await selectedFile.arrayBuffer();
            progressFill.style.width = '20%';
            progressText.textContent = '20% - Reading file';

            // Extract audio
            await ffmpeg.writeFile('input.mp4', new Uint8Array(buffer));
            await ffmpeg.exec(['-i', 'input.mp4', '-vn', '-acodec', 'pcm_s16le', '-ar', '16000', '-ac', '1', 'output.wav']);
            const audioData = await ffmpeg.readFile('output.wav');
            progressFill.style.width = '40%';
            progressText.textContent = '40% - Audio extracted';

            // Decode
            const audioCtx = new AudioContext({ sampleRate: 16000 });
            const audioBuffer = await audioCtx.decodeAudioData(audioData.buffer.slice());
            const pcm = audioBuffer.getChannelData(0);
            progressFill.style.width = '60%';
            progressText.textContent = '60% - Transcribing...';

            // Transcribe
            const lang = langSelect.value === 'auto' ? undefined : langSelect.value;
            const result = await transcriber(pcm, {
                chunk_length_s: 30,
                stride_length_s: 5,
                language: lang
            });

            progressFill.style.width = '100%';
            progressText.textContent = '100% - Done!';
            statusBox.textContent = ' Done!';
            transcriptText.textContent = result.text;
            resultBox.style.display = 'block';
            transcribeBtn.disabled = false;

            await ffmpeg.deleteFile('input.mp4');
            await ffmpeg.deleteFile('output.wav');
        } catch(e) {
            statusBox.textContent = ' Error: ' + e.message;
            transcribeBtn.disabled = false;
            progressWrap.style.display = 'none';
        }
    });

    // Copy
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(transcriptText.textContent);
        statusBox.textContent = ' Copied!';
    });

    // Download
    downloadBtn.addEventListener('click', () => {
        const blob = new Blob([transcriptText.textContent], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'transcript.txt';
        a.click();
    });
</script>

</body>
</html>
