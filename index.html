<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sohàil FX - Video to Text AI</title>
    <meta name="description" content="Free video to text. Works with large files. Real-time progress.">
    <link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22></text></svg>">
    <style>
        * { margin:0; padding:0; box-sizing:border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, sans-serif; background: #fff; color: #000; min-height: 100vh; }
        nav { background: #000; padding: 15px; display: flex; justify-content: space-between; align-items: center; }
        nav .logo { color: #fff; font-weight: 700; font-size: 1.2rem; }
        nav .menu { display: flex; gap: 15px; }
        nav .menu a { color: #aaa; text-decoration: none; font-size: 0.85rem; }
        nav .menu a.active { color: #fff; }
        .container { max-width: 600px; margin: 0 auto; padding: 20px 15px; }
        .card { background: #f8f8f8; border-radius: 16px; padding: 20px; border: 1px solid #ddd; }
        h1 { text-align: center; font-size: 1.6rem; margin-bottom: 5px; }
        .sub { text-align: center; color: #666; font-size: 0.85rem; margin-bottom: 15px; }

        /* Upload */
        .upload-box {
            display: block;
            border: 3px dashed #000;
            border-radius: 12px;
            padding: 30px;
            text-align: center;
            cursor: pointer;
            background: #fff;
            margin: 10px 0;
        }
        .upload-box:active { background: #eee; }
        .upload-box .icon { font-size: 2.5rem; }
        .upload-box .txt { font-weight: 600; margin-top: 5px; }
        .upload-box .hint { font-size: 0.7rem; color: #999; }

        /* File Info */
        #fileInfo {
            display: none;
            background: #e3f2fd;
            padding: 10px;
            border-radius: 8px;
            margin: 8px 0;
            font-weight: 600;
            font-size: 0.9rem;
            word-break: break-all;
        }

        /* Status - BIG & VISIBLE */
        #liveStatus {
            background: #000;
            color: #0f0;
            padding: 12px;
            border-radius: 8px;
            margin: 10px 0;
            font-family: monospace;
            font-size: 0.85rem;
            min-height: 40px;
            line-height: 1.5;
        }

        /* Progress */
        #progressWrap { display: none; margin: 8px 0; }
        #progressBar { height: 10px; background: #ddd; border-radius: 5px; overflow: hidden; }
        #progressFill { height: 100%; background: #000; width: 0%; }
        #progressLabel { display: flex; justify-content: space-between; font-size: 0.75rem; margin-top: 3px; font-weight: 600; }

        .btn {
            width: 100%;
            background: #000;
            color: #fff;
            border: none;
            padding: 14px;
            border-radius: 30px;
            font-weight: 700;
            font-size: 1rem;
            cursor: pointer;
            margin: 8px 0;
        }
        .btn:disabled { background: #ccc; cursor: not-allowed; }

        select {
            width: 100%;
            padding: 12px;
            border: 2px solid #000;
            border-radius: 30px;
            font-size: 0.9rem;
            margin: 8px 0;
        }

        /* Result */
        #resultBox {
            display: none;
            background: #fff;
            border: 2px solid #000;
            border-radius: 12px;
            padding: 15px;
            margin-top: 10px;
            max-height: 250px;
            overflow-y: auto;
            font-family: monospace;
            font-size: 0.85rem;
            white-space: pre-wrap;
            word-break: break-word;
        }
        .actions { display: flex; gap: 8px; margin-top: 10px; }
        .sbtn {
            flex: 1;
            background: #fff;
            border: 2px solid #000;
            padding: 8px;
            border-radius: 20px;
            font-weight: 600;
            font-size: 0.8rem;
            cursor: pointer;
            text-align: center;
        }
        .sbtn:active { background: #000; color: #fff; }

        /* Warning */
        .warning {
            background: #fff9c4;
            padding: 10px;
            border-radius: 8px;
            font-size: 0.75rem;
            margin: 8px 0;
            color: #333;
        }

        footer { text-align: center; padding: 15px; background: #000; color: #fff; font-size: 0.8rem; margin-top: 20px; }
    </style>
</head>
<body>

<nav>
    <div class="logo">SOHÀIL FX</div>
    <div class="menu">
        <a href="index.html" class="active">Home</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
    </div>
</nav>

<div class="container">
    <div class="card">
        <h1> Video  Text</h1>
        <p class="sub">Large files supported • Real-time progress</p>

        <!-- Upload -->
        <label for="fileInput" class="upload-box">
            <div class="icon"></div>
            <div class="txt">Tap to Select Video</div>
            <div class="hint">Supports files up to 500MB+</div>
        </label>
        <input type="file" id="fileInput" accept="video/*,audio/*" style="display:none;">

        <!-- File Info -->
        <div id="fileInfo"></div>

        <!-- Live Status (GREEN TERMINAL STYLE) -->
        <div id="liveStatus"> READY — Select a video file</div>

        <!-- Language -->
        <select id="langSelect">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
            <option value="ur">Urdu</option>
            <option value="auto">Auto-Detect</option>
        </select>

        <!-- Transcribe -->
        <button class="btn" id="transcribeBtn"> Start Transcription</button>

        <!-- Warning for large files -->
        <div class="warning">
             <strong>Large files (50MB+)</strong> may take 2-5 minutes. Keep this tab open. Do not switch apps.
        </div>

        <!-- Progress -->
        <div id="progressWrap">
            <div id="progressBar"><div id="progressFill"></div></div>
            <div id="progressLabel">
                <span id="progressStep">—</span>
                <span id="progressPct">0%</span>
            </div>
        </div>

        <!-- Result -->
        <div id="resultBox">
            <div id="transcriptText"></div>
            <div class="actions">
                <button class="sbtn" id="copyBtn"> Copy</button>
                <button class="sbtn" id="downloadBtn"> Download</button>
            </div>
        </div>
    </div>
</div>

<footer> Made by <strong>Sohàil FX</strong> </footer>

<script type="module">
    import { pipeline } from 'https://cdn.jsdelivr.net/npm/@xenova/transformers@2.17.1/dist/transformers.min.js';
    import { FFmpeg } from 'https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.10/dist/umd/ffmpeg.js';

    const fileInput = document.getElementById('fileInput');
    const fileInfo = document.getElementById('fileInfo');
    const liveStatus = document.getElementById('liveStatus');
    const transcribeBtn = document.getElementById('transcribeBtn');
    const progressWrap = document.getElementById('progressWrap');
    const progressFill = document.getElementById('progressFill');
    const progressStep = document.getElementById('progressStep');
    const progressPct = document.getElementById('progressPct');
    const resultBox = document.getElementById('resultBox');
    const transcriptText = document.getElementById('transcriptText');
    const copyBtn = document.getElementById('copyBtn');
    const downloadBtn = document.getElementById('downloadBtn');
    const langSelect = document.getElementById('langSelect');

    let selectedFile = null;
    let transcriber = null;
    let ffmpeg = null;

    // ----- UPDATE STATUS (terminal style) -----
    function log(msg) {
        liveStatus.textContent = ' ' + msg;
    }

    // ----- LOAD AI IN BACKGROUND -----
    log('Loading AI engine... (first time ~40MB download)');

    ffmpeg = new FFmpeg();
    ffmpeg.load().then(() => {
        log('FFmpeg ready. Downloading AI model...');
    }).catch(e => {
        log('ERROR: FFmpeg failed. Check internet.');
    });

    pipeline('automatic-speech-recognition', 'Xenova/whisper-tiny', {
        progress_callback: (info) => {
            if (info?.status === 'progress' && info.total) {
                const pct = Math.round((info.loaded / info.total) * 100);
                log('Downloading AI model... ' + pct + '%');
            }
        }
    }).then(model => {
        transcriber = model;
        log(' READY — Select a video and tap Start');
    }).catch(e => {
        log('ERROR: AI model failed. Refresh page.');
    });

    // ----- FILE SELECTION -----
    fileInput.addEventListener('change', () => {
        if (fileInput.files.length > 0) {
            selectedFile = fileInput.files[0];
            const sizeMB = (selectedFile.size / 1048576).toFixed(1);
            fileInfo.textContent = ' ' + selectedFile.name + ' — ' + sizeMB + ' MB';
            fileInfo.style.display = 'block';
            log('File selected: ' + selectedFile.name + ' (' + sizeMB + ' MB)');
        }
    });

    // ----- TRANSCRIBE -----
    transcribeBtn.addEventListener('click', async () => {
        if (!selectedFile) {
            log(' No file selected. Tap the upload box first.');
            return;
        }
        if (!transcriber || !ffmpeg) {
            log(' AI still loading. Please wait...');
            return;
        }

        transcribeBtn.disabled = true;
        resultBox.style.display = 'none';
        progressWrap.style.display = 'block';
        progressFill.style.width = '0%';
        progressPct.textContent = '0%';
        progressStep.textContent = 'Starting...';

        const startTime = Date.now();

        try {
            // STEP 1: Read file
            log(' Reading file into memory... (' + (selectedFile.size/1048576).toFixed(0) + ' MB)');
            progressStep.textContent = 'Reading file';
            progressFill.style.width = '5%';
            progressPct.textContent = '5%';

            const buffer = await selectedFile.arrayBuffer();
            const readTime = ((Date.now() - startTime)/1000).toFixed(1);
            log(' File read in ' + readTime + 's. Extracting audio...');
            progressStep.textContent = 'Extracting audio';
            progressFill.style.width = '15%';
            progressPct.textContent = '15%';

            // STEP 2: Extract audio
            await ffmpeg.writeFile('input.mp4', new Uint8Array(buffer));
            await ffmpeg.exec(['-i', 'input.mp4', '-vn', '-acodec', 'pcm_s16le', '-ar', '16000', '-ac', '1', 'output.wav']);
            
            const extractTime = ((Date.now() - startTime)/1000).toFixed(1);
            log(' Audio extracted in ' + extractTime + 's. Reading audio data...');
            progressStep.textContent = 'Reading audio';
            progressFill.style.width = '35%';
            progressPct.textContent = '35%';

            const audioData = await ffmpeg.readFile('output.wav');
            
            // STEP 3: Decode
            log(' Decoding audio...');
            progressStep.textContent = 'Decoding audio';
            progressFill.style.width = '50%';
            progressPct.textContent = '50%';

            const audioCtx = new AudioContext({ sampleRate: 16000 });
            const audioBuffer = await audioCtx.decodeAudioData(audioData.buffer.slice());
            const pcm = audioBuffer.getChannelData(0);
            const duration = audioBuffer.duration.toFixed(1);
            
            log(' Audio decoded. Duration: ' + duration + 's. Transcribing... (may take 1-5 min)');
            progressStep.textContent = 'AI Transcribing';
            progressFill.style.width = '65%';
            progressPct.textContent = '65%';

            // STEP 4: Transcribe
            const lang = langSelect.value === 'auto' ? undefined : langSelect.value;
            const result = await transcriber(pcm, {
                chunk_length_s: 30,
                stride_length_s: 5,
                language: lang
            });

            const totalTime = ((Date.now() - startTime)/1000).toFixed(1);
            progressFill.style.width = '100%';
            progressPct.textContent = '100%';
            progressStep.textContent = 'Done in ' + totalTime + 's';
            log(' DONE! Transcribed in ' + totalTime + ' seconds.');

            transcriptText.textContent = result.text;
            resultBox.style.display = 'block';
            transcribeBtn.disabled = false;

            // Cleanup
            await ffmpeg.deleteFile('input.mp4');
            await ffmpeg.deleteFile('output.wav');
            
        } catch(e) {
            log(' ERROR: ' + e.message);
            transcribeBtn.disabled = false;
            progressWrap.style.display = 'none';
        }
    });

    // Copy
    copyBtn.addEventListener('click', () => {
        navigator.clipboard.writeText(transcriptText.textContent);
        log(' Copied to clipboard!');
    });

    // Download
    downloadBtn.addEventListener('click', () => {
        const blob = new Blob([transcriptText.textContent], {type:'text/plain'});
        const a = document.createElement('a');
        a.href = URL.createObjectURL(blob);
        a.download = 'transcript.txt';
        a.click();
        log(' Downloaded!');
    });
</script>

</body>
</html>
